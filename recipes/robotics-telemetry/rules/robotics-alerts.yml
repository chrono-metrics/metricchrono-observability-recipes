groups:
- name: robotics-telemetry
  rules:
  - alert: RobotBehaviorChanged
    expr: metricchrono_robot_overall_change_score{comparison="known_good_baseline"} > 50
    for: 2m
    labels:
      severity: warning
      main_subsystem: "motion"
      comparison: "known_good_baseline"
    annotations:
      summary: "Robot behavior changed"
      description: "Robot shows sustained behavior change. Inspect fleet overview and source agreement."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Fleet Overview"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotSourceDisagreement
    expr: metricchrono_robot_source_disagreement_score{comparison="sensor_vs_estimator"} > 55
    for: 2m
    labels:
      severity: warning
      main_subsystem: "perception"
      comparison: "sensor_vs_estimator"
    annotations:
      summary: "Robot source disagreement"
      description: "A robot source disagrees with estimator or peers. Inspect Robot Source Agreement."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Source Agreement"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotSourceMissingOrLate
    expr: increase(metricchrono_robot_source_late_total[2m]) > 0 or increase(metricchrono_robot_source_missing_total[2m]) > 0
    for: 2m
    labels:
      severity: warning
      main_subsystem: "telemetry"
      comparison: "current_freshness_vs_expected"
    annotations:
      summary: "Robot source missing or late"
      description: "Telemetry freshness changed. Inspect drivers, middleware, CPU, network, and timestamps."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Source Agreement"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotTrackingDeviation
    expr: metricchrono_robot_tracking_deviation_score{comparison="commanded_vs_actual"} > 55
    for: 2m
    labels:
      severity: warning
      main_subsystem: "motion"
      comparison: "commanded_vs_actual"
    annotations:
      summary: "Robot tracking deviation"
      description: "Commanded and actual motion diverged. Inspect actuator effort and control context."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Incident Replay"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotActuatorEffortChanged
    expr: metricchrono_robot_actuator_effort_change_score > 55
    for: 2m
    labels:
      severity: warning
      main_subsystem: "actuator"
      comparison: "known_good_baseline"
    annotations:
      summary: "Robot actuator effort changed"
      description: "Robot is working harder than usual. Inspect named actuator, current, temperature, payload, and terrain."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Source Agreement"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotLocalizationDisagreement
    expr: metricchrono_robot_localization_disagreement_score > 55
    for: 2m
    labels:
      severity: warning
      main_subsystem: "localization"
      comparison: "sensor_vs_estimator"
    annotations:
      summary: "Robot localization disagreement"
      description: "Localization disagrees with supporting sources. Inspect map, features, lidar/camera, IMU, and odometry."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Source Agreement"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotIncidentCandidate
    expr: metricchrono_robot_inspection_candidate{severity="incident_candidate"} > 0
    for: 2m
    labels:
      severity: warning
      main_subsystem: "triage"
      comparison: "known_good_baseline"
    annotations:
      summary: "Robot incident candidate"
      description: "Top candidate requires replay. Open Robot Incident Replay for the affected robot."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Incident Replay"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
  - alert: RobotRecoveryIncomplete
    expr: metricchrono_robot_recovery_state{state="incomplete"} > 0
    for: 2m
    labels:
      severity: warning
      main_subsystem: "recovery"
      comparison: "post_incident_vs_pre_incident"
    annotations:
      summary: "Robot recovery incomplete"
      description: "Robot left the incident state but change scores remain elevated. Continue investigation."
      asset_group: "{{ $labels.asset_group }}"
      asset: "{{ $labels.asset }}"
      main_subsystem: "{{ $labels.main_subsystem }}"
      comparison: "{{ $labels.comparison }}"
      suggested_dashboard: "Robot Incident Replay"
      suggested_next_action: "Inspect the named subsystem/source, then open the suggested dashboard around the incident window."
