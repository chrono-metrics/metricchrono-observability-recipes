name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Prometheus tools
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Validate recipe assets
        run: npm run validate:recipes
      - name: Test adapter
        run: npm run mlops:test
      - name: Check Prometheus config and rules
        run: npm run mlops:check:prometheus
      - name: Check Rust example
        run: npm run rust:check
      - name: Check Python package smoke
        run: npm run mlops:smoke:python
      - name: Check JavaScript package smoke
        run: npm run mlops:smoke:js
